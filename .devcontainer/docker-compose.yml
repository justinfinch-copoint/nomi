services:
  python-dev:
    image: mcr.microsoft.com/devcontainers/python:2-3.12-bullseye
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomi
      POSTGRES_PASSWORD: nomi
      POSTGRES_DB: nomi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
